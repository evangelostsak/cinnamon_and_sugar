  <script>
    /* Set the theme before first paint. Each lookup is guarded separately. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("cs-theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = "light";
        try {
          if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
        } catch (e) {}
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
